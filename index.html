 IMAGES: keep the "images" folder next to this index.html (same level, flat, no sub-folders):
   images/<plant photos>.jpg/.JPG  and  images/<agency logos>.png/.jpg
 The mountain background and the About-section photo are EMBEDDED in this file.
 If any image ever fails to load, a clean green letter tile is shown instead.
 NOTE: GitHub Pages is case-sensitive, so keep the file names (including .JPG / .jpg) exactly as they are.
-->
<html lang="en"><head><meta charset="utf-8">
<title>SIBOL – Crop Rotation Decision Support Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FEF9E7;--forest:#273822;--olive:#849B5B;--brown:#3D2C22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--card:color-mix(in srgb,var(--cream) 55%,#fff);--line:color-mix(in srgb,var(--olive) 38%,var(--cream));--tint:color-mix(in srgb,var(--olive) 20%,var(--cream));--shadow:0 10px 24px color-mix(in srgb,#273822 30%,transparent)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--brown);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.5px;line-height:1.1;margin:0 0 12px;text-transform:uppercase}
:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
header{background:#273822;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 5vw}
.logo{display:flex;align-items:center;gap:6px;color:#FEF9E7;text-decoration:none;font:34px Anton,Impact,sans-serif}.logo svg{color:#849B5B}
nav{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
nav a,nav button{color:#FEF9E7;text-decoration:none;background:none;border:0;font:inherit;padding:6px 2px;cursor:pointer;border-bottom:2px solid transparent;transition:border-color .2s}
nav a:hover,nav button:hover,nav a.on{border-color:#849B5B}nav button b{color:#849B5B}
main{flex:1}section{display:none}section.on{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:28px 5vw}
.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:540px}
.hl{padding:56px 5vw 40px}.hl h1{font-size:clamp(38px,6vw,64px);color:var(--brown)}
.hl .rule{height:5px;width:min(100%,520px);background:var(--olive);border-radius:3px;margin:14px 0}
.hl p.sub{font-size:22px;letter-spacing:1px;text-transform:uppercase;margin:0 0 20px}
.hr{background:linear-gradient(160deg,#273822,#546a3c);display:flex;align-items:center;justify-content:center;padding:30px}
.frame{background:#FEF9E7;border-radius:26px;padding:10px;max-width:380px;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.frame svg{display:block;width:100%;border-radius:18px}
.field{display:flex;max-width:480px;border:3px solid var(--olive);border-radius:12px;background:var(--card);overflow:hidden}
.field select{flex:1;border:0;padding:14px;font:inherit;background:transparent;color:var(--brown);min-width:0}
.field select option{color:#3D2C22;background:#FEF9E7}
.btn{background:#273822;color:#FEF9E7;border:0;border-radius:12px;padding:13px 22px;font:600 16px Inter,sans-serif;cursor:pointer;margin-top:12px;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.btn:hover{background:var(--olive);color:#273822;transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.alt{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.cards>.card:hover,.dk.rec:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tool{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start}
.tool h1.big{font-size:clamp(34px,6vw,64px)}
.stat p{margin:2px 0;font-size:18px}
.warn{background:var(--tint);border-left:5px solid var(--olive);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:15px}
.dk{background:#273822;color:#FEF9E7;border-radius:20px;padding:22px}
.dk h2{text-align:center;font:500 22px Inter,sans-serif;text-transform:none}
.dk label{display:block;font-size:13px;margin:10px 0 3px;opacity:.9}
.dk input,.dk select{width:100%;padding:11px 12px;border:2px solid transparent;border-radius:12px;background:#FEF9E7;color:#3D2C22;font:inherit;min-height:44px}
.dk input:focus,.dk select:focus{border-color:#849B5B}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dk .btn{background:#849B5B;color:#273822;margin:16px auto 0;display:block}.dk .btn:hover{background:#FEF9E7}
.dk .btn.alt{background:transparent;border:1px solid #FEF9E7;color:#FEF9E7;margin-top:8px;padding:8px 16px}
.rec{display:grid;grid-template-columns:1fr 200px;gap:20px;margin:14px 0}
.rec h3{font-family:Inter,sans-serif;text-transform:none;font-weight:500;font-size:clamp(30px,5vw,46px);margin:0 0 8px}
.rec ul{margin:2px 0 8px 18px;padding:0}.rec a{color:#FEF9E7;text-decoration-color:#849B5B;text-underline-offset:3px}
.ph{display:flex;align-items:center;justify-content:center;background:#849B5B;color:#FEF9E7;font:400 64px Anton,Impact,sans-serif;border-radius:12px;aspect-ratio:1}
.logo-img{width:100%;height:96px;margin-bottom:10px;font-size:34px;aspect-ratio:auto}
.pill{display:inline-block;background:#849B5B;color:#273822;border-radius:99px;padding:2px 12px;font:600 14px Inter;vertical-align:middle;margin-left:8px}
.bars svg{width:100%;height:auto}.bars text{font-size:9px;fill:var(--brown)}.bars .b{fill:var(--olive)}.bars .b.on{fill:#273822}.bars line{stroke:var(--brown)}
.res{text-align:center}.refs li{margin:3px 0;font-size:14px;word-break:break-word}.refs a,.res a{color:var(--brown)}
footer{background:#273822;padding:14px 5vw}footer a{color:#FEF9E7;font-weight:700}
.note{font-size:13px}
.rv{opacity:0;transform:translateY(14px);transition:opacity .3s,transform .25s,box-shadow .25s}.rv.in{opacity:1;transform:none}
@media(max-width:820px){.hero,.tool{grid-template-columns:1fr}.rec{grid-template-columns:1fr}.rec .ph{max-width:200px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}
.pic{width:100%;aspect-ratio:1;object-fit:cover;object-position:center;border-radius:16px;display:block;background:var(--tint)}
img.logo-img{object-fit:contain;object-position:center;background:#fff;border-radius:12px;display:block;padding:6px}
.rec small{display:block;text-align:center;font-style:italic;margin-top:6px}
.spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--olive);border-radius:50%;animation:s 1s linear infinite;margin:16px 0}
@keyframes s{to{transform:rotate(360deg)}}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:900;display:flex;align-items:center;gap:8px;background:#273822;color:#FEF9E7;border:2px solid #849B5B;border-radius:999px;padding:12px 18px;font:600 15px Inter;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,background .2s,color .2s}
.fab:hover{transform:translateY(-3px);background:#849B5B;color:#273822}
.mbk{position:fixed;inset:0;z-index:1100;background:rgba(39,56,34,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mdl{position:relative;background:#FEF9E7;color:#3D2C22;border-radius:20px;padding:26px 22px 22px;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);border-top:6px solid #849B5B;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mdl h2{font-size:30px;color:#273822}
.mdl .x{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;background:transparent;color:#3D2C22;font-size:26px;cursor:pointer;border-radius:50%}
.mdl label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.mdl input[type=text],.mdl textarea{width:100%;padding:11px 12px;border:2px solid #cdd5b8;border-radius:12px;background:#fff;color:#3D2C22;font:inherit}
.mdl input:focus,.mdl textarea:focus{border-color:#849B5B;outline:0}.mdl textarea{resize:vertical;min-height:110px}
#stars{display:flex;gap:4px}.st{background:none;border:0;padding:4px;cursor:pointer;border-radius:8px;transition:transform .2s}.st:hover{transform:scale(1.12)}
.st svg{width:38px;height:38px;fill:transparent;stroke:#849B5B;stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}.st.on svg{fill:#849B5B}
#starlab{min-height:22px;font-size:14px;font-weight:600;color:#273822}
#fbe{color:#8a2d1d;font-size:14px;min-height:20px;margin:8px 0 0}#fbsend{width:100%;margin-top:6px}
.step{display:flex;gap:14px;align-items:flex-start;margin:12px 0}.step p{margin:0 0 4px}.step a{color:var(--brown);font-weight:700}
.step i{flex:none;width:38px;height:38px;border-radius:50%;background:#273822;color:#FEF9E7;display:flex;align-items:center;justify-content:center;font:700 18px Inter;font-style:normal}
.dk input::placeholder{color:#8a7a6e}.dk .btn.alt{padding:8px 16px}
#tr{position:fixed;inset:0;z-index:1200;pointer-events:none}
#tr .tb{position:fixed;background:rgba(39,56,34,.72);pointer-events:auto}
#th{position:fixed;border:3px solid #849B5B;border-radius:12px;box-shadow:0 0 0 4px rgba(132,155,91,.4);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
#tp{position:fixed;z-index:1201;background:#FEF9E7;color:#3D2C22;border-radius:14px;padding:14px 16px;width:min(330px,calc(100vw - 16px));box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:auto;outline:0}
#tp p{margin:4px 0 6px}#tp .tn{font:700 13px Inter;color:#273822}
#tp .ar{position:absolute;width:16px;height:16px;background:#FEF9E7;transform:rotate(45deg)}
#tp .bt{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
#tp button{border:0;border-radius:8px;padding:8px 14px;font:600 14px Inter;cursor:pointer;background:#273822;color:#FEF9E7;min-height:36px}
#tp button[data-a=skip],#tp button[data-a=back]{background:transparent;color:#3D2C22;border:1.5px solid #3D2C22}
#tp span button+button{margin-left:6px}

/* ===== light balance + full-screen hero ===== */
body{min-height:100vh;min-height:100dvh}
main{display:flex;flex-direction:column}
header{background:var(--cream);border-bottom:1px solid var(--line);padding:12px 5vw}
.logo{color:var(--forest)}.logo svg{color:var(--olive)}
nav a,nav button{color:var(--brown)}nav button b{color:var(--forest)}
nav a:hover,nav button:hover,nav a.on{border-color:var(--olive)}
footer{background:var(--tint);border-top:1px solid var(--line);text-align:center;padding:14px 5vw}
footer a{color:var(--forest)}
#p-home.on{display:flex;flex-direction:column;flex:1}
.hero{flex:1;width:100%;min-height:0;grid-template-columns:1.05fr .95fr}
.hl{display:flex;flex-direction:column;justify-content:center;padding:48px 5vw}
.hl h1{color:var(--forest)}
.hr{position:relative;padding:0;overflow:hidden;background:var(--olive)}
.frame{position:absolute;inset:0;max-width:none;width:100%;padding:0;border-radius:0;background:none;box-shadow:none}
.frame svg{display:block;width:100%;height:100%;border-radius:0}
.chips{position:absolute;left:20px;right:20px;bottom:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{background:var(--cream);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.chip b{display:block;font:400 32px/1 Anton,Impact,sans-serif;color:var(--forest)}
.chip span{display:block;font-size:13px;line-height:1.3;margin-top:4px}
.field{border-radius:16px;box-shadow:0 2px 10px color-mix(in srgb,var(--forest) 12%,transparent)}
.btn{border-radius:999px;padding:14px 26px}
.card{border-radius:20px;box-shadow:0 2px 12px color-mix(in srgb,var(--forest) 10%,transparent)}
.dk{background:var(--card);color:var(--brown);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 12px 30px color-mix(in srgb,var(--forest) 14%,transparent)}
.dk h2,.rec h3{color:var(--forest)}
.dk input,.dk select{background:#fff;color:var(--brown);border:2px solid var(--line)}
.dk input:focus,.dk select:focus{border-color:var(--olive)}
.dk .btn{background:var(--forest);color:var(--cream)}.dk .btn:hover{background:var(--olive);color:var(--forest)}
.dk .btn.alt{background:transparent;border:2px solid var(--forest);color:var(--forest)}.dk .btn.alt:hover{background:var(--tint);color:var(--forest)}
.rec a{color:var(--forest);text-decoration-color:var(--olive)}
.rec b{color:var(--forest)}
.pill{background:var(--forest);color:var(--cream)}
.wrap{padding:36px 5vw}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hr{min-height:360px}.hl{padding:40px 5vw}.chip b{font-size:26px}footer{padding-bottom:76px}}
#map{height:min(68vh,560px);border-radius:20px;border:1px solid var(--line);box-shadow:0 8px 24px color-mix(in srgb,var(--forest) 12%,transparent);z-index:0}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:14px 0}
.ctl label{display:block;font-size:13px;margin-bottom:3px}
.ctl select,.ctl input{padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--brown);font:inherit;min-height:44px}
.warn a{color:var(--forest);font-weight:600}

 viewBox='0 0 1440 400' preserveAspectRatio='none'%3E%3Cpath fill='%23849B5B' fill-opacity='.55' d='M0 400V250l180-90 140 70 220-150 200 140 170-80 230 120 160-60 140 50v200z'/%3E%3Cpath fill='%23273822' fill-opacity='.45' d='M0 400V320l220-80 180 60 260-110 220 120 200-70 360 90v70z'/%3E%3C/svg%3E"),linear-gradient(165deg,#e8efdd 0%,#b9cb9d 50%,#849B5B 100%);background-position:center,center bottom,center;background-size:cover,100% 55%,cover;background-repeat:no-repeat}
main{display:block}section{display:block}
header{position:sticky;top:0;z-index:800;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.slide{overflow-x:clip;position:relative;isolation:isolate;scroll-snap-align:start;min-height:calc(100dvh - var(--hh))}
.slide::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.9)}
.s-hero::before{background:linear-gradient(90deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.8) 55%,rgba(255,255,255,.58) 100%)}
.hero-in{max-width:1100px;margin:0 auto;padding:40px 5vw;min-height:calc(100dvh - var(--hh));display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.mark{display:flex;align-items:center;gap:10px;color:var(--olive);font:clamp(56px,10vw,104px)/1 Anton,Impact,sans-serif;letter-spacing:2px}
.mark svg{width:.7em;height:.7em}.mark span{color:var(--forest)}
.hero-in h1{font-size:clamp(28px,4.6vw,52px);color:var(--brown);margin:10px 0 0}
.hero-in .rule{height:5px;width:min(100%,520px);background:var(--olive);border-radius:3px;margin:14px 0}
.hero-in .sub{font-size:22px;letter-spacing:1px;text-transform:uppercase;margin:0 0 12px}
.lead{max-width:560px;font-size:18px;margin:0 0 8px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.row .btn{margin-top:10px;text-decoration:none;display:inline-block}
.scrollhint{position:absolute;left:50%;top:calc(100dvh - var(--hh) - 58px);transform:translateX(-50%);color:var(--forest);font:600 14px Inter;text-decoration:none;display:flex;flex-direction:column;align-items:center;animation:bob 1.8s ease-in-out infinite}
.scrollhint::after{content:"↓";font-size:22px;line-height:1}
@keyframes bob{50%{transform:translate(-50%,7px)}}
.stats{max-width:1100px;margin:0 auto;padding:0 5vw 72px;min-height:38vh;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-content:center}
.stats .chip{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:22px;padding:26px 18px;box-shadow:var(--shadow);text-align:center;position:static}
.stats .chip b{display:block;font:400 clamp(46px,7vw,76px)/1 Anton,Impact,sans-serif;color:var(--forest)}
.stats .chip span{display:block;font-size:15px;margin-top:8px}
.eyebrow{font:600 13px Inter;letter-spacing:2px;text-transform:uppercase;color:var(--forest);margin:0 0 6px}
#mname:empty{display:none}
.tool .field{margin-bottom:6px}
.keynote{background:var(--tint);border-left:5px solid var(--olive);border-radius:10px;padding:9px 13px;font-size:14px;margin:10px 0}
#slide3 .wrap+.wrap{padding-top:56px}
/* slide-in animations */
.rv{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1),box-shadow .25s;transition-delay:var(--d,0s)}
.rv[data-x=l]{transform:translateX(-48px)}.rv[data-x=r]{transform:translateX(48px)}
.rv.in{opacity:1;transform:none}
.rv.done{transition:transform .25s ease,box-shadow .25s ease,opacity .25s;transition-delay:0s}
.dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:700;display:flex;flex-direction:column;gap:14px}
.dots a{width:12px;height:12px;border-radius:50%;border:2px solid var(--forest);background:rgba(255,255,255,.92);transition:transform .2s,background .2s}
.dots a.on{background:var(--forest);transform:scale(1.35)}
@media(max-width:820px){.dots{display:none}.stats{grid-template-columns:1fr;padding-bottom:56px}.scrollhint{display:none}.hero-in{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none}.scrollhint{animation:none}}

/* ===== v3: light mountain overlay (home + analysis only) + a distinct colour per section ===== */
#home::before,#tool::before{background:rgba(255,255,255,.35)}
.glass{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.75);border-radius:28px;padding:30px 34px;box-shadow:0 12px 34px rgba(39,56,34,.2)}
.hero-in>.glass{max-width:680px}.tool>.glass{padding:26px 28px}
.scrollhint{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 18px;box-shadow:var(--shadow)}
/* results: soft cream + deep forest cards */
#results::before{background:var(--cream)}
#results{border-top:6px solid var(--olive)}
#results .wrap>#out>h1{color:var(--forest)}
#results .dk.rec{background:var(--forest);color:var(--cream);border:1px solid var(--forest)}
#results .dk.rec h3,#results .dk.rec b{color:var(--cream)}
#results .dk.rec a{color:var(--cream);text-decoration-color:var(--olive)}
#results .pill{background:var(--olive);color:var(--forest)}
#results .card{background:#fff;border:2px solid var(--forest)}
/* satellite + resources: olive slide, high-contrast cream panels */
#slide3::before{background:var(--olive)}
#slide3 .wrap{background:var(--card);border-radius:26px;box-shadow:0 14px 36px rgba(39,56,34,.28);margin:28px auto;width:min(1100px,calc(100% - 10vw));padding:32px 4vw}
#slide3 .wrap+.wrap{padding-top:32px}
#slide3 .card{background:#fff;border:1px solid var(--line)}
/* about: light page, big green title, framed photo, forest-to-olive block */
#about::before{background:color-mix(in srgb,var(--cream) 55%,#fff)}
#about::after{content:"";position:absolute;right:0;bottom:0;width:min(40%,460px);height:46%;background:linear-gradient(180deg,var(--olive),var(--forest));z-index:-1}
.about-grid{max-width:1100px;margin:0 auto;padding:64px 5vw;display:grid;grid-template-columns:1.05fr 1fr;gap:28px 56px;align-items:start}
.ab-l h1{font:800 clamp(38px,5vw,58px)/1.1 Inter,sans-serif;text-transform:none;letter-spacing:-.5px;color:var(--forest);margin:0 0 18px}
.ab-l p{font-size:15px;line-height:1.7;max-width:500px;margin:0 0 18px}
.ab-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.ab-r h2{font:800 20px Inter,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--forest);margin:8px 0 8px}
.ab-r p{max-width:360px;font-size:15px;line-height:1.65;margin:0}
.photo{position:relative;margin:26px 0 0;width:min(100%,400px);aspect-ratio:4/3;border:6px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 12px 30px rgba(39,56,34,.25);background:linear-gradient(155deg,var(--olive),var(--forest))}
.photo svg{position:absolute;inset:0;margin:auto;width:40%;height:auto;color:var(--cream);opacity:.9}
.photo img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
/* collapsible reference lists */
details.acc{margin-top:14px;text-align:left}
details.acc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px;border:2px solid var(--forest);border-radius:14px;background:#fff;color:var(--forest);font:700 16px Inter,sans-serif;transition:background .2s,color .2s}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▼";font-size:12px;transition:transform .25s}
details.acc>summary:hover{background:var(--tint)}
details.acc[open]>summary{background:var(--forest);color:var(--cream)}
details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc[open]>:not(summary){animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rec details.acc{margin:10px 0 0}
.rec details.acc>summary{background:transparent;border-color:var(--cream);color:var(--cream);padding:9px 14px;font-size:14px}
.rec details.acc>summary:hover{background:rgba(254,249,231,.14)}
.rec details.acc[open]>summary{background:var(--cream);color:var(--forest)}

function advise(o){
 const l0=C.find(c=>c.id===o.last),m=o.m,r=R[m],ok=[],no=[];
 for(const c of C){
  if(!c.m.includes(m)){no.push([c,L(`Outside its planting season (${rng(c.m)})`,`Wala sa panahon ng pagtatanim (${rng(c.m)})`)]);continue}
  if(l0){if(l0.tg[0]===c.tg[0]){no.push([c,L("Same crop family as your last crop (disease and pest build-up)","Kapamilya ng huling itinanim (dumadami ang peste at sakit)")]);continue}
   if(l0.av.some(t=>c.tg.includes(t))){no.push([c,L(`Not advised after ${l0.e} (rotation table)`,`Hindi inirerekomenda pagkatapos ng ${l0.f} (talaan ng rotation)`)]);continue}}
  let s=50;const y=[L(`In season: ${rng(c.m)}`,`Nasa panahon: ${rng(c.m)}`)];
  if(l0&&l0.nx.some(t=>c.tg.includes(t))){s+=25;y.push(L(`Recommended follow-up crop after ${l0.e}`,`Inirerekomendang kasunod ng ${l0.f}`))}
  else if(l0&&l0.h&&c.tg[0]==="legume"){s+=10;y.push(L("Legumes restore nitrogen after a heavy feeder","Ibinabalik ng legume ang nitroheno pagkatapos ng mabigat kumain na pananim"))}
  if(o.prio==="water"){s+=(3-c.w)*10;if(c.w<3)y.push(L("Moderate water need","Katamtaman ang kailangang tubig"))}
  if(o.prio==="soil"){if(c.tg[0]==="legume"){s+=20;y.push(L("Nitrogen fixer: improves soil fertility","Nagdadagdag ng nitroheno sa lupa"))}else if(!c.h){s+=10;y.push(L("Light feeder, gentle on soil","Magaan sa lupa"))}}
  if(o.prio==="pest"){s+=(3-c.p)*10;if(c.p===1)y.push(L("Few major pests listed","Kaunti ang kilalang peste"))}
  if(!c.s.includes(o.soil)&&o.soil!=="loam"){s-=10;y.push(L(`Prefers ${sn(c.s)} soil`,`Mas angkop sa ${sn(c.s)} na lupa`))}
  if(o.water==="rain"&&c.w===3&&r<150){s-=15;y.push(L("High water need but this month is historically dry for rainfed fields","Maraming tubig ang kailangan pero karaniwang tuyo ang buwang ito"))}
  if(r>=300&&c.w===3){s-=10;y.push(L("Leafy crop in a very wet month: rot risk","Madaling mabulok ang madahong pananim sa napakabasang buwan"))}
  if(H[m]>=86&&c.fg){s-=5;y.push(L("Humid month: fungal diseases likely","Mahalumigmig: posibleng sakit na dulot ng amag"))}
  if(c.id==="pechay"&&[9,10,11,0,1].includes(m)){s+=8;y.push(L("Best planted Oct-Feb","Pinakamainam itanim sa Okt-Peb"))}
  if(ENSO.phase==="elnino"&&c.w===3){s-=8;y.push(L("El Niño outlook: higher dry-spell risk and this crop needs a lot of water","Outlook na El Niño: mas mataas ang tsansa ng tagtuyot at maraming tubig ang kailangan ng pananim na ito"))}
  if(ENSO.phase==="lanina"&&c.fg){s-=5;y.push(L("La Niña outlook: wetter conditions raise fungal risk","Outlook na La Niña: mas basa kaya mas mataas ang panganib ng amag"))}
  if(nasa){
   if(nasa.ratio>=1.4&&(c.w===3||c.fg)){s-=6;y.push(L("Recent NASA rainfall is well above normal: rot and fungal risk","Mas mataas kaysa karaniwan ang ulan kamakailan (NASA): panganib ng pagkabulok at amag"))}
   else if(nasa.ratio<=0.6&&c.w===3){s-=8;y.push(L("Recent NASA rainfall is well below normal and this crop needs a lot of water","Mas mababa kaysa karaniwan ang ulan kamakailan (NASA) at maraming tubig ang kailangan ng pananim na ito"))}
   if(nasa.soil!=null&&nasa.soil<0.35&&o.water==="rain"&&c.w===3){s-=6;y.push(L("Dry root zone (NASA soil wetness) for a rainfed field","Tuyo ang lupa sa ugat (NASA soil wetness) para sa bukid na umaasa sa ulan"))}}
  ok.push([c,Math.max(5,Math.min(100,s)),y]);
 }
 return{ok:ok.sort((a,b)=>b[1]-a[1]),no};
}
